{% load static %}{# Copie locale du template graphene-django : assets servis hors ligne. #}
<!--
The request to this GraphQL server provided the header "Accept: text/html"
and as a result has been presented GraphiQL - an in-browser IDE for
exploring GraphQL.
If you wish to receive JSON, provide the header "Accept: application/json" or
add "&raw" to the end of the URL within a browser.
-->
<!DOCTYPE html>
<html>
<head>
  <style>
    html, body, #editor {
      height: 100%;
      margin: 0;
      overflow: hidden;
      width: 100%;
    }
  </style>
  <link href="{% static 'vendor/graphiql/graphiql-graphiql.min.css' %}" rel="stylesheet"
        />
  <link href="{% static 'vendor/graphiql/plugin-explorer-style.css' %}" rel="stylesheet"
        />
  <script src="{% static 'vendor/graphiql/whatwg-fetch-fetch.umd.js' %}"></script>
  <script src="{% static 'vendor/graphiql/react-react.production.min.js' %}"></script>
  <script src="{% static 'vendor/graphiql/react-dom-react-dom.production.min.js' %}"></script>
  <script src="{% static 'vendor/graphiql/graphiql-graphiql.min.js' %}"></script>
  <script src="{% static 'vendor/graphiql/graphql-ws-graphql-ws.min.js' %}"></script>
  <script src="{% static 'vendor/graphiql/plugin-explorer-graphiql-plugin-explorer.umd.js' %}"></script>
</head>
<body>
  <div id="editor"></div>
  {% csrf_token %}
  <script type="application/javascript">
    window.GRAPHENE_SETTINGS = {
    {% if subscription_path %}
      subscriptionPath: "{{subscription_path}}",
    {% endif %}
      graphiqlHeaderEditorEnabled: {{ graphiql_header_editor_enabled|yesno:"true,false" }},
      graphiqlShouldPersistHeaders: {{ graphiql_should_persist_headers|yesno:"true,false" }},
      graphiqlInputValueDeprecation: {{ graphiql_input_value_deprecation|yesno:"true,false" }},
    };
  </script>
  <script src="{% static 'graphene_django/graphiql.js' %}"></script>
</body>
</html>
